<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Mohammed Aafaq — Developer Profile</title><desc id="desc">A burgundy animated developer banner with a technical grid and orbital paths.</desc><defs><linearGradient id="wine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10070C"/><stop offset=".55" stop-color="#451126"/><stop offset="1" stop-color="#190B12"/></linearGradient><linearGradient id="glow"><stop stop-color="#701A3D"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C77B9B" stroke-opacity=".12" stroke-width="1"/></pattern><filter id="blur"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1200" height="360" rx="22" fill="url(#wine)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1020" cy="80" r="100" fill="#701A3D" opacity=".32" filter="url(#blur)"/><g fill="none" stroke="#C77B9B" stroke-opacity=".55"><ellipse cx="980" cy="175" rx="170" ry="65" transform="rotate(-28 980 175)"/><ellipse cx="980" cy="175" rx="170" ry="65" transform="rotate(38 980 175)"/><circle cx="980" cy="175" r="96" stroke-opacity=".25"/></g><circle cx="1095" cy="115" r="5" fill="#E5B5C7"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle><path d="M48 274 C220 244 270 310 420 267 S640 248 760 280" fill="none" stroke="url(#glow)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 9"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="6s" repeatCount="indefinite"/></path><text x="64" y="78" fill="#E5B5C7" font-family="monospace" font-size="16" letter-spacing="5">ENGINEERING • AI • BUILDING</text><text x="60" y="164" fill="#F8F0F3" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="55">MOHAMMED AAFAQ</text><text x